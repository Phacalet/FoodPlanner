name: planning_cuisine
description: Kousso Planning – le menu de la semaine, décidé ensemble en famille.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase : connexion, synchro temps réel, notifications push
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_messaging: ^17.1.0
  flutter_local_notifications: ^23.0.4

  # UI
  google_fonts: ^9.0.0
  intl: ^0.20.3
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plats/
